name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Test
        run: make test

      - name: Build and package Linux ${{ matrix.arch }} plugin
        run: make package VERSION="${VERSION}" GOARCH="${{ matrix.arch }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: artifacts
          merge-multiple: false

      - name: Verify installer artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cat artifacts/*/checksums.txt > checksums.txt
          cp artifacts/plugin-amd64/*.zip artifacts/plugin-arm64/*.zip .
          sha256sum --check checksums.txt
          for ARCH in amd64 arm64; do
            ARCHIVE="commandcode-pool_${VERSION}_linux_${ARCH}.zip"
            test -f "artifacts/plugin-${ARCH}/${ARCHIVE}"
            test "$(unzip -Z1 "artifacts/plugin-${ARCH}/${ARCHIVE}")" = "commandcode-pool.so"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=(
            "artifacts/plugin-amd64/commandcode-pool_${VERSION}_linux_amd64.zip"
            "artifacts/plugin-arm64/commandcode-pool_${VERSION}_linux_arm64.zip"
            "checksums.txt"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
